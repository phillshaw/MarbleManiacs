name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Rules engine
        working-directory: packages/game_core
        run: |
          dart pub get
          dart analyze
          dart test
      - name: App
        working-directory: apps/marble_madness
        run: |
          flutter pub get
          flutter analyze
          flutter test
